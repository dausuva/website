{{ define "main" }}
<article class="wrap section prose">
  <p class="breadcrumbs"><a href="{{ site.Home.RelPermalink }}">Dausuva</a> / <a href="{{ (site.GetPage "/blog").RelPermalink }}">Blog</a></p>
  <h1>{{ .Title }}</h1>
  <p class="lead">{{ .Description }}</p>
  <p class="note">{{ .Date.Format "2 January 2006" }}</p>
  {{ .Content }}
  {{ partial "affiliate-note.html" . }}
</article>
{{ end }}
