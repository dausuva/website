baseURL = "https://dausuva.com/"
title = "Dausuva"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
disableKinds = ["taxonomy", "term", "rss", "section"]
enableRobotsTXT = true
enableGitInfo = true      # real lastmod dates in the sitemap (the workflow checks out full history)

[languages.en]
  label = "English"
  locale = "en"
  contentDir = "content/en"
  weight = 1
  [languages.en.params]
    email = "support@dausuva.com"
    based = "Vilnius, Lithuania"
    address = "Vytauto g. 22-22A, LT-90123 Plungė, Lithuania"

[languages.lt]
  label = "Lietuvių"
  locale = "lt"
  contentDir = "content/lt"
  weight = 2
  [languages.lt.permalinks.page]
    school = "/mokykloms/:slug/"
  [languages.lt.params]
    email = "support@dausuva.lt"
    based = "Vilnius, Lietuva"
    address = "Vytauto g. 22-22A, LT-90123 Plungė, Lietuva"

# Product and company values: change them here only.
[params]
  brand = "Dausuva Labs"
  # The Microsoft Store listing (Store ID 9P5BW5W79G41). storeLive = true: the listing is published and the footer links to it (set false to show it dimmed instead).
  storeUrl = "https://apps.microsoft.com/detail/9P5BW5W79G41"
  storeLive = true
  company = "Dausuva MB"
  companyUrl = "https://dausuva.com/"
  companyCode = "307580523"
  founded = "2026"
  youtubeUrl = "https://www.youtube.com/@dausuva"
  phone = "+370 648 45767"
  phoneLink = "+37064845767"
  product = "Classroom Manager"
  version = "1.2.2"
  # AQAF checks the source code (the link and name are used on the landing page, the proof page and the download page).
  aqafUrl = "https://aqaf.focsd.com/"
  aqafName = "AQAF"
  operatingSystems = ["Windows 10", "Windows 11"]
  priceFirstYear = "€499"
  priceRenewal = "€299"
  # Dausuva Backup (Windows app, Microsoft Store ID 9P42FJ0BN3RZ) and Backup Companion (Android app on Google Play).
  # backupStoreLive = false: the Store listing is not published yet, so the page says "coming soon" instead of linking to it. Set it to true on release day.
  backupName = "Dausuva Backup"
  backupVersion = "0.8.0"
  backupPrice = "€1.99"
  backupStoreUrl = "https://apps.microsoft.com/detail/9P42FJ0BN3RZ"
  backupStoreLive = false
  companionName = "Backup Companion"
  companionPlayUrl = "https://play.google.com/store/apps/details?id=com.dausuva.backup"
  companionPrice = "€1.99"
  # companionPlayLive = false: the Play listing is not published yet, so the page says "coming soon" instead of linking to it. Set it to true on release day.
  companionPlayLive = false

# The product index: the homepage lists these products in this order; each language lists its own.
# A text may contain {token} placeholders. They are filled from [params] above with the lower-case parameter key, for example {pricefirstyear}, {backupprice} or {operatingsystems},
# so that a price, a name or a list of systems is changed in one place only.
# translationkey = the product page's translationKey, path = a page's path, anchor = a section of that page.
# liveparam / urlparam = the [params] switch and link of the product's store listing; getkey / soonkey = the i18n texts of the live button and of the "coming soon" label.
[[languages.en.params.products]]
  name = "{product}"
  translationkey = "school"
  kicker = "For schools · Windows"
  line = "Manage a Windows computer lab from one console: software, files, lock screens, exams, updates."
  facts = ["{operatingsystems}", "From {pricefirstyear} for the first year, then {pricerenewal} a year", "No per-PC charge"]

[[languages.en.params.products]]
  name = "{backupname}"
  path = "/backup"
  kicker = "Windows app · Microsoft Store"
  line = "Back up an Android phone to your Windows PC over USB: apps, photos, videos and files. Check the copy and restore it. No account, no cloud."
  facts = ["{operatingsystems}", "{backupprice} one-time purchase", "One phone, or several at once"]
  liveparam = "backupstorelive"
  urlparam = "backupstoreurl"
  getkey = "getBackupStore"
  soonkey = "backupStoreSoon"

[[languages.en.params.products]]
  name = "{companionname}"
  path = "/backup"
  anchor = "companion"
  kicker = "Android app · Google Play"
  line = "The optional phone side of Dausuva Backup: it prepares contacts, calendars, messages and call records for the backup, each only after you allow it."
  facts = ["Android 7 or later", "{companionprice} one-time purchase", "No network permission"]
  liveparam = "companionplaylive"
  urlparam = "companionplayurl"
  getkey = "getCompanion"
  soonkey = "companionSoon"

[[languages.lt.params.products]]
  name = "{product}"
  translationkey = "school"
  kicker = "Mokykloms · Windows"
  line = "Visa Windows kompiuterių klasė iš vieno pulto: programos, failai, ekranų užrakinimas, egzaminai, atnaujinimai."
  facts = ["{operatingsystems}", "Pirmiems metams {pricefirstyear}, vėliau {pricerenewal} per metus", "Be mokesčio už kompiuterį"]

# Book links. amazonTag empty = neutral links and no disclosure; set it to the Associates tracking ID (name-20) once approved.
[params.affiliate]
  amazonTag = ""
  amazonDomain = "www.amazon.com"

[markup.goldmark.renderer]
  unsafe = true

[minify]
  minifyOutput = true

# The demo video (JSON-LD VideoObject on the landing and demo pages)
[params.video]
  id = "OU81pvKxGTA"
  uploadDate = "2026-11-05"
  duration = "PT4M28S"

# llms.txt: a plain-text summary for AI answer engines, one per language
[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true
[outputs]
  home = ["HTML", "llms"]
