baseURL = "https://dausuva.com/"
title = "Dausuva"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
disableKinds = ["taxonomy", "term", "rss", "section"]
enableRobotsTXT = true
enableGitInfo = true      # real lastmod dates in the sitemap (the workflow checks out full history)

[languages.en]
  label = "English"
  locale = "en"
  contentDir = "content/en"
  weight = 1
  [languages.en.params]
    email = "support@dausuva.com"
    based = "Vilnius, Lithuania"
    address = "Vytauto g. 22-22A, LT-90123 Plungė, Lithuania"

[languages.lt]
  label = "Lietuvių"
  locale = "lt"
  contentDir = "content/lt"
  weight = 2
  [languages.lt.permalinks.page]
    school = "/mokykloms/:slug/"
  [languages.lt.params]
    email = "support@dausuva.lt"
    based = "Vilnius, Lietuva"
    address = "Vytauto g. 22-22A, LT-90123 Plungė, Lietuva"

# Product and company values: change them here only.
[params]
  brand = "Dausuva Labs"
  # The Microsoft Store listing (Store ID 9P5BW5W79G41). storeLive = true: the listing is published and the footer links to it (set false to show it dimmed instead).
  storeUrl = "https://apps.microsoft.com/detail/9P5BW5W79G41"
  storeLive = true
  company = "Dausuva MB"
  companyUrl = "https://dausuva.com/"
  companyCode = "307580523"
  founded = "2026"
  youtubeUrl = "https://www.youtube.com/@dausuva"
  phone = "+370 648 45767"
  phoneLink = "+37064845767"
  product = "Classroom Manager"
  version = "1.2.0"
  operatingSystems = ["Windows 10", "Windows 11"]
  priceFirstYear = "€499"
  priceRenewal = "€299"

[markup.goldmark.renderer]
  unsafe = true

[minify]
  minifyOutput = true

# The demo video (JSON-LD VideoObject on the landing and demo pages)
[params.video]
  id = "OU81pvKxGTA"
  uploadDate = "2026-11-05"
  duration = "PT4M28S"

# llms.txt: a plain-text summary for AI answer engines, one per language
[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true
[outputs]
  home = ["HTML", "llms"]
